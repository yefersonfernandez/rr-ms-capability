server:
  port: 8082
spring:
  application:
    name: "ms-capability"
  devtools:
    add-properties: false
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8082"
adapters:
  r2dbc:
    host: "${R2DBC_HOST}"
    port: "${R2DBC_PORT}"
    database: "${R2DBC_DATABASE}"
    schema: "${R2DBC_SCHEMA}"
    username: "${R2DBC_USERNAME}"
    password: "${R2DBC_PASSWORD}"

logging:
  level:
    org.springframework.r2dbc.core.DefaultDatabaseClient: DEBUG

springdoc:
  swagger-ui:
    path: "/capability/api/doc/swagger-ui.html"
  api-docs:
    path: "/capability/api/doc/api-docs"
routes:
  paths:
    capabilities: "/capability/api/v1/capabilities"
    capabilitiesList: "/capability/api/v1/capabilities/list"
    associate-capabilities: "/capability/api/v1/capabilities/bootcamp-associations"
    get-capabilities-by-bootcamp-id: "/capability/api/v1/botcamps/{bootcampId}/capabilities"
    delete-bootcamp-cascade: "/capability/api/v1/bootcamps/{bootcampId}"

adapter:
  restconsumer:
    timeout: 5000
    url: "http://localhost:8081"

resilience4j:
  circuitbreaker:
    instances:
      associateTechnologiesCB:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
